<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#74b6ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FishSmuggler">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>FishSmuggler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
:root{--ink:#4a2a7a;--pink:#ff5fb8;--pinkd:#c2338a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#74b6ff;font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);overscroll-behavior:none}
#stage canvas{position:fixed;inset:0;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;justify-content:center;z-index:5}
#ui .col{position:relative;width:100%;max-width:520px;height:100%}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}
#scLogin.on,#scMenu.on{pointer-events:auto}
#scGame{pointer-events:none;touch-action:none}
button{font:inherit;cursor:pointer}
.btn{font-weight:600;border:0;border-radius:22px;padding:12px 22px;font-size:20px;color:#fff;background:linear-gradient(#ff9ad6,#ff4fa8);box-shadow:0 5px 0 var(--pinkd),0 9px 18px rgba(120,0,80,.28),inset 0 3px 0 rgba(255,255,255,.55);text-shadow:0 2px 0 rgba(150,0,90,.35);transition:transform .08s,box-shadow .08s;position:relative}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pinkd),0 3px 8px rgba(120,0,80,.25),inset 0 3px 0 rgba(255,255,255,.55)}
.btn.cyan{background:linear-gradient(#8ff8ef,#1fc3d6);box-shadow:0 5px 0 #138fa5,0 9px 18px rgba(0,80,110,.28),inset 0 3px 0 rgba(255,255,255,.55);text-shadow:0 2px 0 rgba(0,90,120,.35)}
.btn.yellow{background:linear-gradient(#fff08a,#ffbf1f);box-shadow:0 5px 0 #d08a00,0 9px 18px rgba(130,80,0,.28),inset 0 3px 0 rgba(255,255,255,.6);color:#8a4a00;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.btn.purple{background:linear-gradient(#c9a8ff,#8a5cff);box-shadow:0 5px 0 #5e35c8,0 9px 18px rgba(60,0,130,.28),inset 0 3px 0 rgba(255,255,255,.55);text-shadow:0 2px 0 rgba(60,0,140,.35)}
.btn.green{background:linear-gradient(#a8f58a,#3fca4f);box-shadow:0 5px 0 #23913a,0 9px 18px rgba(0,100,30,.28),inset 0 3px 0 rgba(255,255,255,.55);text-shadow:0 2px 0 rgba(0,100,30,.35)}
.btn.gray{background:linear-gradient(#f0eaf8,#c9bede);box-shadow:0 5px 0 #9a8bb8,0 9px 18px rgba(60,40,100,.2),inset 0 3px 0 rgba(255,255,255,.7);color:#5a4a7a;text-shadow:none}
.btn.small{font-size:16px;padding:8px 14px;border-radius:16px}
.btn[disabled]{filter:grayscale(.8);opacity:.7}
.badge{position:absolute;top:-8px;right:-8px;background:#ff3b6b;color:#fff;border:3px solid #fff;border-radius:14px;min-width:26px;height:26px;font-size:15px;line-height:20px;text-align:center;animation:pulse .7s infinite alternate;display:none}
.badge.on{display:block}
.panel{background:linear-gradient(#ffffff,#fff0fb);border-radius:30px;border:4px solid #fff;box-shadow:0 0 0 4px #ffb8e4,0 18px 40px rgba(60,0,90,.35);padding:20px;text-align:center;width:min(92vw,400px);max-height:88vh;overflow:auto}
.panel h2{margin:0 0 10px;font-size:30px;color:#ff4fa8;text-shadow:0 2px 0 #fff,0 4px 0 #ffc4e8}
.panel p{margin:8px 0;font-size:17px;line-height:1.35}
.ov{position:fixed;inset:0;background:rgba(40,20,90,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;pointer-events:auto;z-index:50;animation:fadein .2s}
.ov .panel{animation:jelly .55s cubic-bezier(.2,1.5,.4,1)}
.ov.out{animation:fadeout .18s forwards}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
@keyframes fadein{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
@keyframes jelly{0%{transform:scale(.4,.3)}45%{transform:scale(1.08,.92)}70%{transform:scale(.96,1.04)}100%{transform:scale(1)}}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.12)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wob{0%,100%{transform:translateY(0) rotate(-3deg) scale(1,1)}50%{transform:translateY(-5px) rotate(3deg) scale(1.05,.95)}}
/* Logo */
.logo{font-weight:700;font-size:min(13vw,60px);text-align:center;line-height:1;letter-spacing:1px;white-space:nowrap}
.logo span{display:inline-block;animation:wob 2.2s ease-in-out infinite;text-shadow:0 3px 0 #ff4fa8,0 6px 0 #9a5cff,0 10px 18px rgba(80,0,120,.45)}
.logo.small{font-size:34px}
/* Login */
#scLogin .inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:20px}
.sub{color:#fff;font-size:19px;font-weight:600;text-shadow:0 2px 6px rgba(60,0,120,.5);text-align:center}
.inp{font:inherit;font-size:22px;font-weight:600;width:100%;padding:12px 16px;border-radius:18px;border:3px solid #ffc4e8;background:#fff;color:var(--ink);text-align:center;outline:none;-webkit-user-select:text;user-select:text}
.inp:focus{border-color:#ff5fb8;box-shadow:0 0 0 4px rgba(255,95,184,.25)}
.err{color:#e0245e;font-size:15px;min-height:20px;margin-top:6px}
/* Menu */
.topbar{position:absolute;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));display:flex;gap:8px;align-items:center;z-index:2}
.pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.9);border:3px solid #fff;border-radius:20px;padding:5px 12px 5px 8px;font-weight:700;font-size:19px;box-shadow:0 5px 14px rgba(60,0,100,.22)}
.pill small{font-size:13px;font-weight:600;color:#b04a9a}
.pill .plus{background:#3fca4f;color:#fff;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:17px;margin-left:2px}
.sp{flex:1}
.round{width:46px;height:46px;border-radius:50%;border:3px solid #fff;background:radial-gradient(circle at 35% 30%,#fff,#e6dbff 50%,#a678ff);font-size:22px;box-shadow:0 4px 0 #7444e0,0 6px 14px rgba(60,0,100,.3);display:flex;align-items:center;justify-content:center;padding:0}
.round:active{transform:translateY(3px)}
.pearl{display:inline-block;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 16%,#fff0fa 30%,#f6c4ea 65%,#c792e6);box-shadow:0 0 6px rgba(255,255,255,.9),inset -2px -2px 4px rgba(150,80,200,.35);vertical-align:middle;flex:none}
.pearl.s{width:16px;height:16px}
#mHead{position:absolute;left:0;right:0;top:calc(68px + env(safe-area-inset-top));text-align:center}
.progs{display:flex;gap:8px;justify-content:center;margin-top:8px;padding:0 10px}
.prog{background:rgba(255,255,255,.85);border:3px solid #fff;border-radius:16px;padding:4px 10px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;box-shadow:0 4px 10px rgba(60,0,100,.18)}
.pbar{width:60px;height:9px;border-radius:6px;background:rgba(160,80,200,.18);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#7ff5ec,#ff5fb8);border-radius:6px}
#lvScroll{position:absolute;left:0;right:0;top:calc(175px + env(safe-area-inset-top));bottom:calc(84px + env(safe-area-inset-bottom));overflow-y:auto;padding:4px 12px 20px;-webkit-overflow-scrolling:touch;touch-action:pan-y;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 14px,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(transparent,#000 14px,#000 calc(100% - 18px),transparent)}
#lvScroll::-webkit-scrollbar{display:none}
.chap{border-radius:28px;border:4px solid rgba(255,255,255,.85);padding:12px 10px 16px;margin:12px 0;box-shadow:0 10px 24px rgba(60,0,100,.25),inset 0 0 30px rgba(255,255,255,.35)}
.chT{color:#fff;font-weight:700;font-size:20px;text-align:center;text-shadow:0 2px 0 rgba(120,40,160,.5),0 3px 8px rgba(60,0,120,.4);margin-bottom:10px}
.chap.soon{background:rgba(255,255,255,.55);text-align:center;font-weight:600;font-size:18px;padding:18px}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px 6px;justify-items:center}
.lv{width:58px;height:58px;border-radius:50%;border:3px solid #fff;padding:0;position:relative;font-weight:700;font-size:22px;color:#fff;background:radial-gradient(circle at 35% 28%,#fff 0 10%,#ffc4ea 30%,#ff5fb8 75%,#d02f8a);box-shadow:0 4px 0 rgba(140,20,90,.5),0 8px 14px rgba(60,0,100,.3),inset 0 -4px 8px rgba(120,0,80,.25);text-shadow:0 2px 0 rgba(140,0,90,.5)}
.lv:active{transform:translateY(3px) scale(.96)}
.lv em{position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);font-style:normal;font-size:14px;color:#ffd21f;letter-spacing:-1px;text-shadow:0 1px 0 #a35a00,0 0 4px rgba(255,255,255,.8);white-space:nowrap}
.lv.cur{background:radial-gradient(circle at 35% 28%,#fff 0 10%,#fff6b0 30%,#ffcf2f 75%,#e09a00);animation:pulse .8s ease-in-out infinite alternate;color:#8a4a00;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.lv.lock{background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.7),rgba(220,210,240,.55) 60%,rgba(170,150,210,.55));box-shadow:0 3px 0 rgba(90,70,140,.3);font-size:18px}
.bottombar{position:absolute;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}
.bottombar .btn{flex:1;font-size:17px;padding:12px 6px;border-radius:20px}
/* Game HUD */
#hud{position:absolute;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top));display:flex;gap:8px;align-items:stretch;pointer-events:auto}
.hbox{background:linear-gradient(rgba(255,255,255,.94),rgba(255,236,250,.92));border-radius:22px;border:3px solid #fff;box-shadow:0 6px 16px rgba(60,0,100,.25);padding:6px 10px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.lbl{font-size:12px;font-weight:600;color:#b04a9a;text-transform:uppercase;letter-spacing:.5px}
.big{font-size:32px;font-weight:700;line-height:1}
#hMovesBox{min-width:76px}
#hMovesBox.low .big{color:#ff3b6b;animation:pulse .5s infinite alternate}
#hGoals{flex:1;display:flex;justify-content:center;gap:12px;align-items:center;flex-direction:row}
.goal{display:flex;flex-direction:column;align-items:center;font-weight:700;font-size:17px;line-height:1.05}
.goal img{width:38px;height:38px;object-fit:contain}
.goal .gicon{font-size:28px;line-height:38px}
.goal.done span{color:#2fbf5a}
#hScoreBox{min-width:104px}
#hScore{font-size:22px;font-weight:700}
.sbar{height:10px;border-radius:6px;background:rgba(160,80,200,.18);position:relative;margin:8px 4px 2px}
.sbar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#ffd23f,#ff5fb8);transition:width .3s}
.sbar b{position:absolute;top:-8px;font-size:15px;transform:translateX(-50%);color:#d8c8e8;text-shadow:0 0 2px #fff}
.sbar b.on{color:#ffc400;text-shadow:0 1px 0 #a35a00}
#bbar{position:absolute;left:8px;right:8px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:12px;justify-content:center;align-items:center;pointer-events:auto}
.bst{position:relative;width:64px;height:64px;border-radius:50%;border:3px solid #fff;background:radial-gradient(circle at 35% 30%,#fff,#ffd0ef 45%,#ff8fd0);font-size:30px;box-shadow:0 5px 0 #d14f9f,0 8px 16px rgba(80,0,80,.3);padding:0;display:flex;align-items:center;justify-content:center}
.bst:active{transform:translateY(3px)}
.bst .cnt{position:absolute;right:-6px;bottom:-4px;background:#7b4dff;color:#fff;border-radius:12px;font-size:14px;font-weight:700;padding:1px 7px;border:2px solid #fff;line-height:18px}
.bst .cnt.buy{background:#2fbf5a}
.bst.act{animation:pulse .5s infinite alternate;box-shadow:0 0 0 5px #ffe14d,0 5px 0 #d14f9f,0 8px 16px rgba(80,0,80,.3)}
.bst.pause{width:50px;height:50px;font-size:22px;background:radial-gradient(circle at 35% 30%,#fff,#e6dbff 50%,#a678ff);box-shadow:0 4px 0 #7444e0,0 6px 14px rgba(60,0,100,.3)}
#bBanner{position:absolute;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom));display:none;pointer-events:auto;background:rgba(255,255,255,.95);border:3px solid #fff;border-radius:20px;padding:8px 12px;box-shadow:0 6px 16px rgba(60,0,100,.3);font-weight:600;font-size:16px;align-items:center;gap:8px;justify-content:space-between}
#bBanner.on{display:flex;animation:jelly .4s}
/* Toast */
#toasts{position:fixed;left:0;right:0;top:calc(140px + env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:80;pointer-events:none}
.toast{background:rgba(255,255,255,.96);border:3px solid #fff;border-radius:18px;padding:9px 16px;font-weight:600;box-shadow:0 8px 20px rgba(60,0,100,.3);animation:jelly .45s;max-width:90vw;text-align:center}
/* Schatztruhe */
.cv{position:fixed;inset:0;z-index:120;overflow:hidden;pointer-events:auto;background:radial-gradient(ellipse at 50% 62%,#7a4ad8 0,#3a1f8a 45%,#140a3a 100%);opacity:0}
.cv .cvRays{position:absolute;left:var(--cx,50%);top:var(--cy,52%);width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;background:repeating-conic-gradient(rgba(255,230,150,.22) 0 5deg,rgba(255,230,150,0) 5deg 15deg);-webkit-mask-image:radial-gradient(circle,#000 0,rgba(0,0,0,.6) 8%,transparent 26%);mask-image:radial-gradient(circle,#000 0,rgba(0,0,0,.6) 8%,transparent 26%);animation:cvspin 30s linear infinite;opacity:0;pointer-events:none}
@keyframes cvspin{to{transform:rotate(360deg)}}
.cvBokeh{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,190,240,.15) 55%,rgba(255,255,255,0) 70%);animation:cvfloat linear infinite}
@keyframes cvfloat{from{transform:translateY(20px)}to{transform:translateY(-110vh)}}
.cv h2{position:absolute;top:calc(max(14px,env(safe-area-inset-top)) + 4vh);left:0;right:0;text-align:center;margin:0;font-size:clamp(30px,9vh,58px);font-weight:700;letter-spacing:1px;
  background:linear-gradient(100deg,#fff6c8 0,#ffd54a 30%,#fff 45%,#ffb62e 60%,#ffe9a0 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #a0520f) drop-shadow(0 0 14px rgba(255,210,90,.6));animation:cvshine 2.6s linear infinite;pointer-events:none}
@keyframes cvshine{from{background-position:120% 0}to{background-position:-130% 0}}
.cvStage{position:absolute;left:50%;top:58%;width:min(60vh,42vw,320px);aspect-ratio:200/170}
.cvFloor{position:absolute;left:-30%;right:-30%;bottom:-14%;height:34%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,220,140,.55),rgba(255,160,220,.18) 45%,rgba(255,255,255,0) 70%);pointer-events:none}
.cvBeam{position:absolute;left:4%;right:4%;bottom:62%;height:330%;transform-origin:50% 100%;transform:scaleY(0);opacity:0;pointer-events:none;
  background:linear-gradient(to top,rgba(255,250,210,.95),rgba(255,230,140,.5) 30%,rgba(255,200,255,.12) 75%,rgba(255,255,255,0));clip-path:polygon(18% 100%,82% 100%,100% 0,0 0);filter:blur(2px)}
.cvBox{position:absolute;inset:0}
.cvBox svg{position:absolute;display:block;overflow:visible}
.cvInside{left:9%;width:82%;top:16%;height:28%}
.cvBase{left:0;top:38%;width:100%;height:62%;filter:drop-shadow(0 10px 10px rgba(20,0,60,.45))}
.cvLid{position:absolute;left:0;top:0;width:100%;height:41.2%;transform-origin:50% 100%}
.cvLid svg{left:0;top:0;width:100%;height:100%}
.cvLid svg.back{display:none}
.cvSeam{position:absolute;left:6%;right:6%;top:38.5%;height:3px;border-radius:3px;background:#fff6c0;box-shadow:0 0 10px 4px rgba(255,220,120,.9),0 0 26px 10px rgba(255,190,90,.6);opacity:0}
.cvLock{position:absolute;left:41%;width:18%;top:28%;height:22%}
.cvLock svg{width:100%;height:100%;position:static}
.cvFlash{position:absolute;left:50%;top:38%;width:240%;aspect-ratio:1;margin-left:-120%;transform:translateY(-50%) scale(0);border-radius:50%;background:radial-gradient(circle,#fff 0,rgba(255,246,190,.9) 18%,rgba(255,220,120,.35) 40%,rgba(255,220,120,0) 65%);opacity:0;pointer-events:none}
.cvList{position:absolute;left:52%;right:3%;top:58%;display:flex;flex-direction:column;gap:12px;transform:translateY(-50%)}
.cvItem{display:flex;align-items:center;gap:14px;background:linear-gradient(#fff,#fff3fb);border:3px solid #ffe08a;border-radius:20px;padding:6px 18px 6px 10px;box-shadow:0 0 0 3px rgba(255,255,255,.35),0 8px 22px rgba(20,0,60,.45),inset 0 -4px 0 #ffd6ee;font-size:clamp(17px,4.6vh,27px);font-weight:700;color:var(--ink);opacity:0}
.cvItem .ic{font-size:clamp(32px,8vh,50px);line-height:1;width:1.3em;height:1.3em;display:flex;align-items:center;justify-content:center;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffe9a8 60%,#ffc94a);box-shadow:0 0 12px rgba(255,210,90,.8)}
.cvItem .ic .pearl{width:70%;height:70%}
.cvOrb{position:absolute;left:0;top:0;width:clamp(54px,14vh,84px);aspect-ratio:1;margin:calc(clamp(54px,14vh,84px)/-2) 0 0 calc(clamp(54px,14vh,84px)/-2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(30px,8vh,48px);pointer-events:none;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95),rgba(255,240,190,.75) 35%,rgba(255,200,90,.35) 65%,rgba(255,200,90,0) 72%);box-shadow:0 0 30px 10px rgba(255,220,130,.55)}
.cvOrb .pearl{width:55%;height:55%}
.cv .cvGo{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));right:3%;width:min(46%,260px);white-space:nowrap;opacity:0}
.cvP{position:absolute;left:0;top:0;pointer-events:none;line-height:1}
.cvWorld{position:absolute;inset:0}
.cvShk{position:absolute;inset:0;transform-origin:50% 58%;will-change:transform}
.cv .cvRays{will-change:transform}
.cvDim{position:absolute;inset:0;background:#0a0420;opacity:0;pointer-events:none}
.cvWhite{position:absolute;inset:0;background:radial-gradient(circle at 50% 55%,#fff 0,#fffbe8 45%,#ffe9b0 100%);opacity:0;pointer-events:none}
.cvGlow{position:absolute;left:-55%;right:-55%;top:-55%;bottom:-35%;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(255,250,215,.95) 0,rgba(255,212,90,.6) 22%,rgba(255,150,220,.22) 42%,rgba(255,255,255,0) 64%)}
.cv.shell .cvGlow{background:radial-gradient(circle at 50% 45%,rgba(255,245,252,.95) 0,rgba(255,150,215,.6) 22%,rgba(180,140,255,.25) 42%,rgba(255,255,255,0) 64%)}
.cvRing{border-radius:50%;border-style:solid}
.cvDust{border-radius:50%;margin:-22px 0 0 -22px;background:radial-gradient(circle,rgba(255,238,215,.9) 0,rgba(230,205,255,.4) 50%,rgba(255,255,255,0) 72%)}
.cvConf{width:9px;height:15px;border-radius:2px;margin:-7px 0 0 -4px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.cvMote{width:11px;height:11px;border-radius:50%;background:radial-gradient(circle,#fff 0,#ffeaa0 45%,rgba(255,220,120,0) 75%)}
.cv.shell{background:radial-gradient(ellipse at 50% 62%,#ff8fd0 0,#8a3ab8 45%,#1a0a4a 100%)}
.cvBub{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.9);background:rgba(255,255,255,.18)}
.cvCoin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffbe0,#ffd54a 45%,#d48a10);box-shadow:0 0 6px rgba(255,210,90,.9)}
.cvGem{width:14px;height:14px;clip-path:polygon(50% 0,100% 40%,50% 100%,0 40%)}
.cvPearl{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffe6f6 40%,#e9a8dc)}

<script>
'use strict';
const RESET_GEN=1;let WAS_RESET=false; // Neustart-Runde (siehe loadSave)
/* =========================================================
   FishSmuggler – Match-3 mit Blubberfischen
   Engine: PixiJS 8 + GSAP 3 · Version 0.14.0
   ========================================================= */
const VERSION='0.15.0';
const MAX_LEVEL=10000;     // Generator liefert Level bis 10000 (Server-Grenze ebenfalls 10000)
const U=80;                // interne Kachelgröße (wird skaliert)
const LIFE_MAX=5, LIFE_MS=15*60*1000; // 15 Minuten pro Leben
const isBoss=n=>n%25===0;
const SAVE_KEY='fishsmuggler_save_v1';

const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=n=>Math.round(n).toLocaleString('de-DE');
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function dayNum(s){const [y,m,d]=s.split('-').map(Number);return Math.round(new Date(y,m-1,d).getTime()/86400000)}
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
const hexN=h=>parseInt(h.slice(1),16);

/* ---------------- Texte (für spätere Übersetzung zentral) ---------------- */
const T={
  nickErr:'3–16 Zeichen: Buchstaben, Zahlen, _ oder -',
  soon:'Kommt bald! 🫧',
  rankSoon:'Die Online-Rangliste kommt bald! 🏆',
  codeSoon:'Spielstand-Code & PIN kommen zusammen mit der Online-Rangliste.',
  noPearls:'Nicht genug Perlen! 🦪',
  combo:['','','Toll!','Super!','Wunderbar!','Fisch-tastisch!','Blubber-genial!','Unglaublich!'],
};

/* ---------------- Spielstand ---------------- */
function defaultSave(){return{v:1,nick:null,levels:{},pearls:50,boosters:{bomb:1,current:1,rainbow:1},lives:LIFE_MAX,lifeTs:null,
  settings:{music:true,musicVol:.5,sfx:true,sfxVol:.8,vib:true,quality:'high',reduceMotion:false,hints:true,leaderboard:true,notify:false},
  aqua:null,shell:0,chests:[],resetGen:RESET_GEN,wheelTs:null,streak:0,loginDay:null,inLevel:0,stats:{played:0,won:0},created:Date.now()}}
let S=defaultSave();
/* Neustart für alle: Spielstände älter als RESET_GEN werden auf Anfang gesetzt (Name, Online-Zugang und Einstellungen bleiben) */
function loadSave(){try{const raw=localStorage.getItem(SAVE_KEY);if(raw){let o=JSON.parse(raw);
  if((o.resetGen||0)<RESET_GEN){const k={nick:o.nick||null,online:o.online,settings:o.settings,loginDay:o.loginDay,streak:o.streak,wheelTs:o.wheelTs};o=Object.assign(defaultSave(),k);o.aqua=null;WAS_RESET=true}
  const d=defaultSave();S=Object.assign(d,o);S.settings=Object.assign(defaultSave().settings,o.settings||{});S.boosters=Object.assign({bomb:0,current:0,rainbow:0},o.boosters||{});S.stats=Object.assign({played:0,won:0},o.stats||{})}}catch(e){S=defaultSave()}if(!S.aqua||!Array.isArray(S.aqua.fish))S.aqua=defaultAqua();if(S.aqua.starterV!==2){S.aqua.deco=(S.aqua.deco||[]).filter(d=>!((d.id===2&&d.t==='weed')||(d.id===3&&d.t==='coral')));S.aqua.starterV=2}if(!S.aqua.design){S.aqua.design='std';S.aqua.designs=['std']}S.resetGen=RESET_GEN;if(S.online&&S.online.sig==='@')S.online.sig=progSig();if(WAS_RESET)save()}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}if(typeof scheduleHungerNotify==='function'&&S&&S.aqua)try{scheduleHungerNotify()}catch(e){}}

/* ---------------- Leben ---------------- */
function tickLives(){
  if(S.lives>=LIFE_MAX){S.lifeTs=null;return}
  if(!S.lifeTs)S.lifeTs=Date.now();
  const n=Math.floor((Date.now()-S.lifeTs)/LIFE_MS);
  if(n>0){S.lives=Math.min(LIFE_MAX,S.lives+n);S.lifeTs+=n*LIFE_MS;if(S.lives>=LIFE_MAX)S.lifeTs=null;save()}
}
function lifeRemain(){return S.lifeTs?Math.max(0,LIFE_MS-(Date.now()-S.lifeTs)):0}
function loseLife(){tickLives();if(S.lives>=LIFE_MAX)S.lifeTs=Date.now();S.lives=Math.max(0,S.lives-1);save()}
const mmss=ms=>{const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};

/* ---------------- Fische, Themen, Booster ---------------- */
// Spielsteine: Meeresbewohner. Index = Stein-ID. Welche Steine ein Level nutzt, bestimmt TILESETS.
const FISH=[
  {name:'Fisch',   label:'rosa Fische',        col:'#ff2e9a',light:'#ff9ad0',dark:'#b8106c',shape:'round'},
  {name:'Muschel', label:'Muscheln',           col:'#9b3dff',light:'#d4a8ff',dark:'#5a14c8',shape:'shell'},
  {name:'Perle',   label:'Perlen',             col:'#f4ecff',light:'#ffffff',dark:'#a07ad8',shape:'pearl'},
  {name:'Seestern',label:'Seesterne',          col:'#ffb000',light:'#ffe66b',dark:'#e05a00',shape:'star'},
  {name:'Fisch',   label:'türkise Fische',     col:'#00d6cc',light:'#7ffff2',dark:'#00879a',shape:'long'},
  {name:'Fisch',   label:'grüne Fische',       col:'#4ade14',light:'#b8ff78',dark:'#229a00',shape:'box'},
  {name:'Fisch',   label:'blaue Fische',       col:'#1f6bff',light:'#8ec0ff',dark:'#0a34c4',shape:'angel'},
  {name:'Fisch',   label:'rote Fische',        col:'#ff1f3d',light:'#ff8a96',dark:'#a8001c',shape:'drop'},
  {name:'Fisch',   label:'korallenrote Fische',col:'#ff6a1f',light:'#ffc08a',dark:'#d63f00',shape:'heart'},
];
// Muschel, Perle, Seestern sind immer dabei; die Fischfarben wechseln je Kapitel. Nie gelb/orange/rot-ähnliche Farben gleichzeitig.
const TILESETS=[[0,1,2,3,4,5],[6,1,2,3,5,0],[7,1,2,3,4,5],[6,1,2,3,7,5]];
const THEMES=[
  {name:'Korallengarten',  top:'#a6f2ff',mid:'#74b6ff',bot:'#8a63ff',accent:'#ff8fd6'},
  {name:'Lagunenglitzer',  top:'#c2fff4',mid:'#45d0d8',bot:'#2b80d6',accent:'#ffe46b'},
  {name:'Bonbonriff',      top:'#ffe4f6',mid:'#ff9fd8',bot:'#a35cff',accent:'#8ff8ef'},
  {name:'Mondscheinbucht', top:'#bccaff',mid:'#6c6ef2',bot:'#30308a',accent:'#ffd84d'},
  {name:'Pfirsichlagune',  top:'#fff2d6',mid:'#ffb48e',bot:'#ff6fa8',accent:'#7fe0ff'},
  {name:'Seegrasdschungel',top:'#dcffcc',mid:'#5fd69a',bot:'#1f8a8a',accent:'#ffa0e2'},
];
const BOOST={
  bomb:   {name:'Blubberbombe',    icon:'💥',desc:'Lässt ein 3×3-Feld zerplatzen.',price:180},
  current:{name:'Strömung',        icon:'🌊',desc:'Spült eine ganze Reihe oder Spalte weg.',price:225},
  rainbow:{name:'Regenbogenwirbel',icon:'🌈',desc:'Entfernt alle Fische einer Farbe.',price:330},
};
const MOVES_PRICE=[90,150,225];
const LIFE_PRICE=60;
function randomBooster(rng=Math.random){const x=rng();return x<.5?'bomb':x<.85?'current':'rainbow'}

/* ---------------- Level-Generator ---------------- */
function makeMask(shape,R,C){
  const m=[];for(let r=0;r<R;r++){m.push([]);for(let c=0;c<C;c++)m[r].push(true)}
  const off=(r,c)=>{if(r>=0&&c>=0&&r<R&&c<C)m[r][c]=false};
  if(shape==='cornersCut'){off(0,0);off(0,C-1);off(R-1,0);off(R-1,C-1)}
  else if(shape==='plus'){for(const[r,c]of[[0,0],[0,1],[1,0],[0,C-1],[0,C-2],[1,C-1],[R-1,0],[R-2,0],[R-1,1],[R-1,C-1],[R-2,C-1],[R-1,C-2]])off(r,c)}
  else if(shape==='holeCenter'){const r0=Math.floor(R/2)-1,c0=Math.floor(C/2)-1;off(r0,c0);off(r0+1,c0);if(C%2===0){off(r0,c0+1);off(r0+1,c0+1)}}
  else if(shape==='heart'&&C===8){[0,3,4,7].forEach(c=>off(0,c));for(let c=0;c<8;c++){if(c<1||c>6)off(R-3,c);if(c<2||c>5)off(R-2,c);if(c<3||c>4)off(R-1,c)}}
  else if(shape==='diamond'){const cr=(R-1)/2,cc=(C-1)/2;for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(Math.abs(r-cr)/(R/2)+Math.abs(c-cc)/(C/2)>1.3)off(r,c)}
  else if(shape==='heart'){off(0,0);off(0,C-1);off(R-1,0);off(R-1,C-1)}
  return m;
}
const TUNE={rampLen:2500,rampPow:.6,rampW:.75,rhythm:[0,.12,.22,.34,-.1],boss:.3,moves0:24,movesE:7,movesMin:12,col0:13,colE:12,ice0:5,iceE:10,cage0:4,cageE:5,chain0:4,chainE:6,jelly0:2,jellyE:4,y4:1500,y5:800,y6:400,s1a:.45,s1b:.5,gRef:.9,gs:[.4,.75,1.1],early:0,mv:.82,gm:1.4,sm:1.5};
const NEWMECH={sand:33,cage:58,chain:83,jelly:108};
const WEED_PATTERNS={
  center:(r,c,R,C)=>Math.abs(r-(R-1)/2)<1&&Math.abs(c-(C-1)/2)<2.5?1:0,
  bottom:(r,c,R,C)=>r>=R-2?1:0,
  diamond:(r,c,R,C)=>Math.abs(r-(R-1)/2)+Math.abs(c-(C-1)/2)<=2?1:0,
  bands:(r,c,R,C)=>(r<=1||r>=R-2)&&c>=2&&c<=C-3?1:0,
  core2:(r,c,R,C)=>Math.abs(r-(R-1)/2)<1&&Math.abs(c-(C-1)/2)<2?2:0,
  cross:(r,c,R,C)=>(Math.abs(r-(R-1)/2)<1||Math.abs(c-(C-1)/2)<1)?1:0,
  checker:(r,c,R,C)=>(r+c)%2===0&&r>=2&&r<=R-3?1:0,
  frame:(r,c,R,C)=>(r===0||c===0||r===R-1||c===C-1)?1:0,
};
const tuneW=n=>n<=5?.3:n<=10?.6:n<=200?1:n<=1000?1-(n-200)/800*.4:Math.max(.15,.6-(n-1000)/1500*.45);
function getLevel(n){
  const rng=mulberry32(n*7919+13);
  const pick=a=>a[Math.floor(rng()*a.length)];
  const ch=Math.floor((n-1)/25);
  const L={n,ch,set:TILESETS[ch%TILESETS.length],theme:THEMES[ch%THEMES.length],rows:7,cols:7,colors:5,moves:25,type:'score',goals:[],weedPat:null,weedLayers:1,ice:0,shape:'full',sandPat:null,cage:0,chain:0,jelly:0};
  const cols5=[0,1,2,3,4].sort(()=>rng()-.5);
  if(n<=10){
    L.colors=n<=5?4:5;L.moves=[25,25,24,24,23,23,22,22,22,21][n-1];L.rows=n<=3?7:8;L.cols=7;
  }else if(n<=20){
    L.type='goals';L.rows=8;L.cols=7;L.moves=19-Math.floor((n-11)/4);
    if(n<16)L.goals=[{type:'collect',color:L.set[cols5[0]],count:12+(n-11)*2}];
    else L.goals=[{type:'collect',color:L.set[cols5[0]],count:10+(n-16)*2},{type:'collect',color:L.set[cols5[1]],count:10+(n-16)*2}];
  }else if(n<=30){
    L.type='goals';L.rows=8;L.cols=8;L.moves=27-Math.floor((n-21)/4)-(n>=26?4:0)-([21,23,25].includes(n)?4:0);
    if(n<=25){L.weedPat=['center','bottom','diamond','bands','core2'][n-21];if(n===25)L.weedLayers=2}
    else if(n<=28){L.ice=6+(n-26)*2;if(n>=27)L.shape='cornersCut'}
    else if(n===29){L.ice=6;L.goals=[{type:'collect',color:L.set[cols5[0]],count:15}];L.shape='cornersCut'}
    else{L.weedPat='diamond';L.ice=4;L.shape='heart'}
  }else{
    // Endlos-Generator: Schwierigkeit e = Grundanstieg + Rhythmus (leicht/mittel/schwer/Erholung) + Kapitel-Endgegner
    const ramp=Math.min(1,Math.pow((n-30)/TUNE.rampLen,TUNE.rampPow));
    const e=Math.max(0,Math.min(1.25,ramp*TUNE.rampW+TUNE.rhythm[n%5]+(n%25===0?TUNE.boss:0)));L.e=e;
    L.type=pick(['score','goals','goals','goals']);
    L.rows=pick([7,8,8,9]);L.cols=pick([7,8,8]);
    L.colors=(ch>=5&&rng()<.2+ramp*.3)?6:5;
    L.shape=pick(ch>=1?['full','full','cornersCut','plus','holeCenter','diamond','heart']:['full','cornersCut']);
    L.moves=Math.max(TUNE.movesMin,Math.round(TUNE.moves0-e*TUNE.movesE-rng()*2));
    if(L.type==='goals'){
      const pool=['collect','weed','ice','collect+ice','weed+collect','weed+ice'];
      if(e>.45)pool.push('collect+weed+ice','collect2');
      if(n>=NEWMECH.sand+5)pool.push('sand','sand+collect','sand+weed');if(n>=NEWMECH.cage+5)pool.push('cage','cage+collect','cage+ice');
      if(n>=NEWMECH.chain+5)pool.push('chain','chain+collect','chain+cage');if(n>=NEWMECH.jelly+5)pool.push('jelly','jelly+collect','jelly+sand');
      const mech=pick(pool);
      const cc=L.colors===6?[0,1,2,3,4,5].sort(()=>rng()-.5):cols5;
      if(mech.includes('collect'))L.goals.push({type:'collect',color:L.set[cc[0]],count:Math.round(TUNE.col0+e*TUNE.colE+rng()*4)});
      if(mech==='collect2'||(mech==='collect'&&rng()<.35+e*.4))L.goals.push({type:'collect',color:L.set[cc[1]],count:Math.round((TUNE.col0+e*TUNE.colE)*.8+rng()*4)});
      if(mech.includes('weed')){L.weedPat=pick(Object.keys(WEED_PATTERNS));L.weedLayers=rng()<.1+e*.6?2:1}
      if(mech.includes('ice'))L.ice=Math.round(TUNE.ice0+e*TUNE.iceE+rng()*3);
      if(mech.includes('sand'))L.sandPat=pick(Object.keys(WEED_PATTERNS));
      if(mech.includes('cage'))L.cage=Math.round(TUNE.cage0+e*TUNE.cageE+rng()*2);
      if(mech.includes('chain'))L.chain=Math.round(TUNE.chain0+e*TUNE.chainE+rng()*2);
      if(mech.includes('jelly'))L.jelly=Math.round(TUNE.jelly0+e*TUNE.jellyE+rng()*1.5);
      if(L.cage&&L.ice){L.ice=Math.min(8,L.ice);L.cage=Math.min(7,L.cage)}
    }
  }
  if(n<=30)L.e=(n-1)/60;
  for(const [m,st] of Object.entries(NEWMECH)){if(n>=st&&n<st+5){const k=n-st;
    L.type='goals';L.goals=[];L.weedPat=null;L.ice=0;L.sandPat=null;L.cage=L.chain=L.jelly=0;L.rows=8;L.cols=8;L.colors=5;L.shape='full';L.moves=({sand:[26,20,18,17,20],cage:[23,23,22,22,22],chain:[26,25,24,23,22],jelly:[18,17,16,15,14]}[m])[k];
    if(m==='sand')L.sandPat=['bottom','center','diamond','bands','frame'][k];
    if(m==='cage')L.cage=[5,6,7,7,8][k];
    if(m==='chain')L.chain=[4,5,6,7,8][k];
    if(m==='jelly')L.jelly=[3,4,5,6,7][k]}}
  const tw=tuneW(n),mvE=1+(TUNE.mv-1)*tw,gmE=1+(TUNE.gm-1)*tw,smE=1+(TUNE.sm-1)*tw;
  L.moves=Math.max(9,Math.round(L.moves*mvE));
  if(TUNE.gm!==1){const gm=gmE;L.ice=Math.min(16,Math.round(L.ice*gm));L.cage=Math.min(10,Math.round(L.cage*gm));L.chain=Math.min(11,Math.round(L.chain*gm));L.jelly=Math.min(8,Math.round(L.jelly*gm));
    L.goals.forEach(g=>{if(g.type==='collect')g.count=Math.round(g.count*gm)})}
  L.mask=makeMask(L.shape,L.rows,L.cols);
  {const patCount=pat=>{let k=0;for(let r=0;r<L.rows;r++)for(let c=0;c<L.cols;c++)if(L.mask[r][c]&&WEED_PATTERNS[pat](r,c,L.rows,L.cols))k++;return k};
   const fixPat=pat=>{if(!pat||patCount(pat)>=8)return pat;for(const k of Object.keys(WEED_PATTERNS))if(patCount(k)>=8)return k;return null};
   L.weedPat=fixPat(L.weedPat);L.sandPat=fixPat(L.sandPat)}

function onTick(tk){
  perfWatch(tk.deltaMS);const dt=Math.min(.05,tk.deltaMS/1000);const t=performance.now()/1000;const W=innerWidth,H=innerHeight;
  if(L.rays.visible)L.rays.children.forEach(r=>{r.rotation=Math.sin(t*.25+r.ph)*.18;r.alpha=.18+Math.sin(t*.5+r.ph)*.1});
  if(L.glows.visible)L.glows.children.forEach(g=>{g.x=g.bx+Math.sin(t*.2+g.ph)*40;g.y=g.by+Math.cos(t*.17+g.ph)*30});
  L.amb.children.forEach(b=>{if(!b.visible)return;b.y-=b.vy*dt;b.x+=Math.sin(t*1.5+b.ph)*.4;if(b.y<-30)resetAmb(b)});
  aqTick(dt,t);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){p.s.destroy();parts.splice(i,1);continue}p.s.x+=p.vx*dt;p.s.y+=p.vy*dt;p.vy+=p.g*dt;const k=p.life/p.max;p.s.alpha=Math.min(1,k*1.6);p.s.rotation+=p.spin*dt;p.s.scale.set(p.grow?p.sc+(1-k)*p.grow:p.sc*(.5+.5*k))}
  if(G){const a=S.settings.reduceMotion?.012:.04;
    for(let r=0;r<G.rows;r++)for(let c=0;c<G.cols;c++){const tl=G.grid[r]&&G.grid[r][c];if(!tl||!tl.inner)continue;const s=Math.sin(t*2.4+tl.ph);tl.inner.scale.set(1+a*s,1-a*s);tl.inner.rotation=Math.sin(t*1.3+tl.ph)*(a*1.1);if(tl.glow.visible){tl.glow.alpha=.45+Math.sin(t*5+tl.ph)*.25;if(tl.special==='rainbow')tl.body.rotation=Math.sin(t*2+tl.ph)*.15}
      if(tl.special==='bomb'||tl.special==='mega'){const q=Math.sin(t*5+tl.ph);tl.body.rotation=Math.sin(t*3.4+tl.ph)*.13;tl.inner.scale.set(1+.07*q,1-.07*q)}}
    if(L.selS.visible){L.selS.alpha=.7+Math.sin(t*8)*.3}
  }
}

function makeTile(color,special,encased){

  const v=new PIXI.Container();const inner=new PIXI.Container();v.addChild(inner);

function refreshTile(t){t.body.texture=t.jelly?TEX.jelly:tileTex(t);t.body.rotation=0;t.glow.visible=!!t.special&&!t.jelly;t.glow.tint=t.special==='rainbow'?0xffffff:t.special==='bomb'?0xffe14d:t.special==='mega'?0xff7a3d:hexN(FISH[t.color<0?0:t.color].col);t.ice.texture=t.cage?TEX.cage[t.cage>1?2:1]:TEX.ice;t.ice.visible=!!t.encased&&!t.jelly;t.chn.visible=!!t.chain}

function randColor(){return G.set[Math.floor(Math.random()*G.colors)]}
const cellColor=(r,c)=>{const t=inB(r,c)&&G.grid[r][c];return t&&t.special!=='rainbow'?t.color:-1};

function findMatches(){
  const runs=[];
  for(let r=0;r<G.rows;r++){let c=0;while(c<G.cols){const k=cellColor(r,c);if(k<0){c++;continue}let e=c+1;while(e<G.cols&&cellColor(r,e)===k)e++;if(e-c>=3){const cells=[];for(let i=c;i<e;i++)cells.push([r,i]);runs.push({dir:'h',cells})}c=e}}
  for(let c=0;c<G.cols;c++){let r=0;while(r<G.rows){const k=cellColor(r,c);if(k<0){r++;continue}let e=r+1;while(e<G.rows&&cellColor(e,c)===k)e++;if(e-r>=3){const cells=[];for(let i=r;i<e;i++)cells.push([i,c]);runs.push({dir:'v',cells})}r=e}}
  const par=runs.map((_,i)=>i);const f=i=>par[i]===i?i:(par[i]=f(par[i]));const owner=new Map();
  runs.forEach((run,i)=>run.cells.forEach(([r,c])=>{const k=key(r,c);if(owner.has(k))par[f(i)]=f(owner.get(k));else owner.set(k,i)}));
  const gm=new Map();runs.forEach((run,i)=>{const root=f(i);if(!gm.has(root))gm.set(root,{runs:[],cells:new Map()});const g=gm.get(root);g.runs.push(run);run.cells.forEach(([r,c])=>g.cells.set(key(r,c),[r,c]))});
  return [...gm.values()].map(g=>({runs:g.runs,cells:[...g.cells.values()]}));
}
function groupSpecial(g){const mx=Math.max(...g.runs.map(r=>r.cells.length));const h=g.runs.some(r=>r.dir==='h'),v=g.runs.some(r=>r.dir==='v');
  const n=g.cells.length;if(n>=7)return 'rainbow';if(n>=6)return 'mega';if(n>=5)return 'bomb';if(h&&v)return 'bomb';if(mx===4)return g.runs.find(r=>r.cells.length===4).dir==='h'?'stripeV':'stripeH';return null}
function pickSpawn(g,pref,sp){
  const ok=p=>{const t=G.grid[p[0]][p[1]];return t&&!t.special&&!t.encased};const inG=new Set(g.cells.map(([r,c])=>key(r,c)));
  if(pref)for(const p of pref)if(inG.has(key(p[0],p[1]))&&ok(p))return p;
  if(sp==='bomb'){const hs=new Set();g.runs.filter(r=>r.dir==='h').forEach(run=>run.cells.forEach(([r,c])=>hs.add(key(r,c))));for(const run of g.runs)if(run.dir==='v')for(const p of run.cells)if(hs.has(key(p[0],p[1]))&&ok(p))return p}
  const run=g.runs.reduce((a,b)=>b.cells.length>a.cells.length?b:a);const mid=run.cells[Math.floor(run.cells.length/2)];if(ok(mid))return mid;
  return g.cells.find(ok)||null;
}
function matchAt(r,c){const k=cellColor(r,c);if(k<0)return false;let n=1;for(let i=c-1;cellColor(r,i)===k;i--)n++;for(let i=c+1;cellColor(r,i)===k;i++)n++;if(n>=3)return true;n=1;for(let i=r-1;cellColor(i,c)===k;i--)n++;for(let i=r+1;cellColor(i,c)===k;i++)n++;return n>=3}
function findMove(){
  for(let r=0;r<G.rows;r++)for(let c=0;c<G.cols;c++){const a=inB(r,c)&&G.grid[r][c];if(!a||a.encased||a.chain)continue;
    for(const [dr,dc] of [[0,1],[1,0]]){const r2=r+dr,c2=c+dc;const b=inB(r2,c2)&&G.grid[r2][c2];if(!b||b.encased||b.chain)continue;
      if(a.special==='rainbow'||b.special==='rainbow'||(a.special&&b.special))return [[r,c],[r2,c2]];
      G.grid[r][c]=b;G.grid[r2][c2]=a;const m=matchAt(r,c)||matchAt(r2,c2);G.grid[r][c]=a;G.grid[r2][c2]=b;if(m)return [[r,c],[r2,c2]];}}
  for(let r=0;r<G.rows;r++)for(let c=0;c<G.cols;c++){const a=inB(r,c)&&G.grid[r][c];if(a&&(a.special==='bomb'||a.special==='mega')&&!a.encased&&!a.chain)return [[r,c]]}
  return null;
}
function mostCommonColor(){const n=new Array(FISH.length).fill(0);for(let r=0;r<G.rows;r++)for(let c=0;c<G.cols;c++){const t=inB(r,c)&&G.grid[r][c];if(t&&t.color>=0&&!t.special)n[t.color]++}let b=0;n.forEach((v,i)=>{if(v>n[b])b=i});return b}
function cellsOfColor(col){const out=[];for(let r=0;r<G.rows;r++)for(let c=0;c<G.cols;c++){const t=inB(r,c)&&G.grid[r][c];if(t&&t.color===col&&t.special!=='rainbow')out.push([r,c])}return out}
function specialCells(t,r,c,fx){
  const out=[];
  if(t.special==='stripeH'){for(let i=0;i<G.cols;i++)if(inB(r,i))out.push([r,i]);fx.push({type:'beam',r,c,dir:'h'})}
  else if(t.special==='stripeV'){for(let i=0;i<G.rows;i++)if(inB(i,c))out.push([i,c]);fx.push({type:'beam',r,c,dir:'v'})}
  else if(t.special==='bomb'){for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++)if(Math.abs(dr)+Math.abs(dc)<=2&&inB(r+dr,c+dc))out.push([r+dr,c+dc]);fx.push({type:'ring',r,c,size:2.6})}
  else if(t.special==='mega'){for(let dr=-3;dr<=3;dr++)for(let dc=-3;dc<=3;dc++)if(Math.abs(dr)<=2&&Math.abs(dc)<=2||Math.abs(dr)+Math.abs(dc)<=3)if(inB(r+dr,c+dc))out.push([r+dr,c+dc]);fx.push({type:'ring',r,c,size:3.6})}
  else if(t.special==='rainbow'){const col=t.target??mostCommonColor();const cs=cellsOfColor(col);out.push(...cs);fx.push({type:'light',r,c,targets:cs,color:col})}
  return out;
}

  const g=new PIXI.Graphics();g.blendMode='add';L.fx.addChild(g);const x0=cx(c),y0=cy(r);const tc=col>=0&&FISH[col]?hexN(FISH[col].col):0xffffff;

async function playFx(fx){

function sandHit(r,c){

async function processClear(clear,spawns,fx){

  const freed=new Set();

    if(v.src==='match')for(const [dr,dc] of [[0,1],[1,0],[0,-1],[-1,0]]){const r2=v.r+dr,c2=v.c+dc;const n=inB(r2,c2)&&G.grid[r2][c2];if(n&&n.encased)freed.add(key(r2,c2))}}

  for(const [k,v] of clear){const t=G.grid[v.r][v.c];if(!t)continue;sx+=cx(v.c);sy+=cy(v.r);cnt++;
    if(t.encased)continue;
    if(t.chain){t.chain=0;const g=G.goals.find(g=>g.type==='chain');if(g)g.got++;t.chn.visible=false;for(let i=0;i<4;i++)part(L.fx,TEX.dot,cx(v.c),cy(v.r),{tint:0x6fe0a0,vx:(Math.random()-.5)*240,vy:(Math.random()-.5)*240,g:300,life:.5,sc:.45})}
    if(spawnKeys.has(k)){weedN+=weedHit(v.r,v.c);continue}
    G.grid[v.r][v.c]=null;destroyed++;
    if(t.color>=0&&t.special!=='rainbow'){const g=G.goals.find(g=>g.type==='collect'&&g.color===t.color);if(g)g.got++}
    weedN+=weedHit(v.r,v.c);
    const d=Math.hypot(cx(v.c)-ox,cy(v.r)-oy)/U;pops.push(popTile(t,Math.min(.25,d*.03)));}
  let freedN=0,jellyN=0;for(const k of freed){const r=Math.floor(k/32),c=k%32;const t=G.grid[r][c];if(!t||!t.encased)continue;
    if(t.jelly){t.encased=0;G.grid[r][c]=null;jellyN++;const g=G.goals.find(g=>g.type==='jelly');if(g)g.got++;weedN+=weedHit(r,c);pops.push(popTile(t,0));sfx('star',2);continue}
    if(t.cage>1){t.cage--;refreshTile(t);squish(t,1.6);sfx('nope');for(let i=0;i<4;i++)part(L.fx,TEX.dot,cx(c),cy(r),{tint:0xf3b79c,vx:(Math.random()-.5)*240,vy:(Math.random()-.5)*240,g:300,life:.45,sc:.4});continue}
    const wasCage=!!t.cage;t.cage=0;t.encased=0;freedN++;
    const ice=new PIXI.Sprite(TEX.ice);ice.anchor.set(.5);ice.x=cx(c);ice.y=cy(r);ice.scale.set(U*1.04/192);L.fx.addChild(ice);gsap.to(ice.scale,{x:U*1.5/192,y:U*1.5/192,duration:.25});gsap.to(ice,{alpha:0,duration:.25,onComplete:()=>ice.destroy()});
    for(let i=0;i<5;i++)part(L.fx,TEX.dot,cx(c),cy(r),{tint:0xc8f0ff,vx:(Math.random()-.5)*260,vy:(Math.random()-.5)*260,g:300,life:.5,sc:.45});
    refreshTile(t);squish(t);const g=G.goals.find(g=>g.type===(wasCage?'cage':'ice'));if(g)g.got++;weedN+=weedHit(r,c);}
  let sandN=0;if(G.sand){const hit=new Set();for(const v of clear.values()){hit.add(key(v.r,v.c));if(v.src==='match')for(const [dr,dc] of [[0,1],[1,0],[0,-1],[-1,0]])hit.add(key(v.r+dr,v.c+dc))}
    for(const k of hit){const r=Math.floor(k/32),c=k%32;if(inB(r,c))sandN+=sandHit(r,c)}}
  for(const s of spawns){const t=G.grid[s.r][s.c];if(!t)continue;t.special=s.special;if(s.special==='rainbow'||s.special==='bomb'||s.special==='mega')t.color=-1;t.activated=false;refreshTile(t);
    gsap.fromTo(t.view.scale,{x:.4,y:.4},{x:1,y:1,duration:.7,ease:'elastic.out(1.2,.35)'});sparkle(cx(s.c),cy(s.r),lowQ()?4:10);}
  if(spawns.length)sfx('special');
  const mult=1+G.cascade*.5;const bonus=spawns.reduce((a,s)=>a+({stripeH:120,stripeV:120,bomb:250,mega:400,rainbow:500}[s.special]||0),0);
  const pts=Math.round(destroyed*60*mult+freedN*40+weedN*50+jellyN*150+sandN*40+bonus);G.score+=pts;
  if(pts>0&&cnt)floatText(sx/cnt,sy/cnt,'+'+fmt(pts),pts>800?38:30,0xffffff,[0xff4fa8,0x8a5cff,0x1fc3d6,0xffa000][G.cascade%4]);

async function applyGravity(){
  const proms=[];
  for(let c=0;c<G.cols;c++){const P=[];for(let r=0;r<G.rows;r++)if(G.mask[r][c])P.push(r);if(!P.length)continue;
    const tiles=[];for(const r of P)if(G.grid[r][c])tiles.push(G.grid[r][c]);const empty=P.length-tiles.length;if(!empty)continue;
    for(const r of P)G.grid[r][c]=null;

    for(let i=0;i<empty;i++){const r=P[i];const t=makeTile(randColor(),null,0);t.view.x=cx(c);t.view.y=cy(P[0])-(empty-i)*U-U*.2;G.grid[r][c]=t;proms.push(fallTo(t,r,c))}}

async function resolve(first){

      clear=new Map();for(const g of groups){for(const [r,c] of g.cells)clear.set(key(r,c),{r,c,src:'match'});const sp=groupSpecial(g);if(sp){const p=pickSpawn(g,step&&step.pref,sp);if(p)spawns.push({r:p[0],c:p[1],special:sp})}}}
    step=null;
    await processClear(clear,spawns,fx);if(G!==myG)return;
    await applyGravity();if(G!==myG)return;
    G.cascade++;
    if(!G.ended&&G.cascade>=5&&(G.cascade-5)%2===0){miniText(((G.cascade-5)/2)%2===0?'Toll!':'Super!');sfx('combo',G.cascade)}

/* ---- Spezial-Kombinationen beim Tauschen ---- */
function comboFor(a,b,ra,ca){
  const sa=a.special,sb=b.special;
  if(!sa&&!sb)return null;
  if(sa!=='rainbow'&&sb!=='rainbow'&&(!sa||!sb))return null;
  return async()=>{
    const clear=new Map(),fx=[];const add=(r,c)=>{if(inB(r,c))clear.set(key(r,c),{r,c,src:'blast'})};
    const posOf=t=>{for(let r=0;r<G.rows;r++)for(let c=0;c<G.cols;c++)if(G.grid[r][c]===t)return [r,c]};
    const [rb,cb]=posOf(b);
    if(sa==='rainbow'&&sb==='rainbow'){a.activated=b.activated=true;const all=[];for(let r=0;r<G.rows;r++)for(let c=0;c<G.cols;c++)if(inB(r,c)){add(r,c);all.push([r,c])}fx.push({type:'light',r:ra,c:ca,targets:all,color:-1});fx.push({type:'ring',r:ra,c:ca,size:5});}
    else if(sa==='rainbow'||sb==='rainbow'){
      const R=sa==='rainbow'?a:b,X=sa==='rainbow'?b:a;const [rr,rc]=posOf(R);const [xr,xc]=posOf(X);R.activated=true;add(rr,rc);
      const col=X.color>=0?X.color:mostCommonColor();const targets=cellsOfColor(col);
      if(X.special){const conv=targets.filter(([r,c])=>{const t=G.grid[r][c];return t&&!t.special&&!t.encased});
        lightning(rr,rc,conv,col);sfx('rainbow');
        for(const [r,c] of conv){const t=G.grid[r][c];t.special=(X.special==='bomb'||X.special==='mega')?X.special:(Math.random()<.5?'stripeH':'stripeV');refreshTile(t);squish(t);sparkle(cx(c),cy(r),2)}
        await sleep(550);for(const [r,c] of conv)add(r,c);add(xr,xc);
      }else{for(const [r,c] of targets)add(r,c);fx.push({type:'light',r:rr,c:rc,targets,color:col})}
    }else{
      a.activated=b.activated=true;add(ra,ca);add(rb,cb);const isS=s=>s==='stripeH'||s==='stripeV',isB=s=>s==='bomb'||s==='mega';
      const RB=(sa==='mega'||sb==='mega')?3:2;
      if(isS(sa)&&isS(sb)){for(let i=0;i<G.cols;i++)add(ra,i);for(let i=0;i<G.rows;i++)add(i,ca);fx.push({type:'beam',r:ra,c:ca,dir:'h'},{type:'beam',r:ra,c:ca,dir:'v'})}
      else if((isB(sa)||isB(sb))&&(isS(sa)||isS(sb))){for(let d=-1;d<=1;d++){for(let i=0;i<G.cols;i++)add(ra+d,i);for(let i=0;i<G.rows;i++)add(i,ca+d);if(ra+d>=0&&ra+d<G.rows)fx.push({type:'beam',r:ra+d,c:ca,dir:'h'});if(ca+d>=0&&ca+d<G.cols)fx.push({type:'beam',r:ra,c:ca+d,dir:'v'})}}
      else{for(let dr=-RB;dr<=RB;dr++)for(let dc=-RB;dc<=RB;dc++)add(ra+dr,ca+dc);fx.push({type:'ring',r:ra,c:ca,size:RB*2.25})}
    }
    vib(40);
    await resolve({clear,fx});
  };
}

function fillInitial(iceCount,rng,lv){lv=lv||{};

  const usedC=new Set(iceSet);const pickCells=(n,minRow)=>{if(!n)return new Set();const cd=playable.filter(([r,c])=>r>=minRow&&!usedC.has(key(r,c))).sort(()=>rng()-.5).slice(0,n);cd.forEach(([r,c])=>usedC.add(key(r,c)));return new Set(cd.map(([r,c])=>key(r,c)))};
  const cageSet=pickCells(lv.cage,1),jellySet=pickCells(lv.jelly,1),chainSet=pickCells(lv.chain,0);

      const kk=key(r,c);G.grid[r][c]={color:col,special:null,encased:(iceSet.has(kk)||cageSet.has(kk)||jellySet.has(kk))?1:0,cage:cageSet.has(kk)?2:0,jelly:jellySet.has(kk)?1:0,chain:chainSet.has(kk)?1:0}}

/* ---- Booster im Level ---- */
function selectBooster(type){
  if(!G||G.busy||G.ended)return;
  if(G.booster===type){cancelBooster();return}
  if(S.boosters[type]<=0){buyBoosterDialog(type,()=>selectBooster(type));return}
  G.booster=type;clearHint();deselect();
  document.querySelectorAll('.bst[data-b]').forEach(b=>b.classList.toggle('act',b.dataset.b===type));
  $('#bText').innerHTML=type==='bomb'?'Tippe auf ein Feld 💥<br><small>Platzt 3×3 Felder weg</small>':type==='current'?'Tippe auf ein Feld 🌊<br><small>Spült Reihe oder Spalte weg</small>':'Tippe auf einen Fisch 🌈<br><small>Alle dieser Farbe verschwinden</small>';
  $('#bDir').style.display=type==='current'?'':'none';$('#bDir').textContent=G.boostDir==='row'?'↔ Reihe':'↕ Spalte';
  $('#bBanner').classList.add('on');sfx('select');
}
function cancelBooster(){if(G)G.booster=null;document.querySelectorAll('.bst[data-b]').forEach(b=>b.classList.remove('act'));$('#bBanner').classList.remove('on')}
async function applyBooster(r,c){
  const type=G.booster;cancelBooster();if(S.boosters[type]<=0)return;S.boosters[type]--;save();updateHUD();
  const myG=G;G.busy=true;clearHint();const clear=new Map(),fx=[];const add=(rr,cc)=>{if(inB(rr,cc))clear.set(key(rr,cc),{r:rr,c:cc,src:'blast'})};
  if(type==='bomb'){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)add(r+dr,c+dc);fx.push({type:'ring',r,c,size:2})}
  else if(type==='current'){if(G.boostDir==='row'){for(let i=0;i<G.cols;i++)add(r,i);fx.push({type:'beam',r,c,dir:'h'})}else{for(let i=0;i<G.rows;i++)add(i,c);fx.push({type:'beam',r,c,dir:'v'})}fx.push({type:'wave'})}
  else{const t=G.grid[r][c];const col=t&&t.color>=0?t.color:mostCommonColor();const cs=cellsOfColor(col);cs.forEach(([a,b])=>add(a,b));fx.push({type:'light',r,c,targets:cs,color:col})}
  vib(50);await resolve({clear,fx});if(G!==myG)return;G.busy=false;await afterTurn();
}

/* ---- Rundenende ---- */
const goalDone=g=>g.type==='score'?G.score>=g.target:g.got>=g.count;
async function afterTurn(){
  if(!G)return;updateHUD();if(G.ended)return;
  const done=G.goals.every(goalDone);
  if(G.lv.type!=='score'&&done)return win();
  if(G.moves<=0){if(G.lv.type==='score'&&done)return win();return outOfMoves()}
  if(G.goals.some(g=>g.type==='jelly'&&(g.got||0)<g.count)){await moveJellies();if(!G||G.ended)return;
    if(G.lv.type!=='score'&&G.goals.every(goalDone))return win()}
  if(!findMove())await shuffleBoard();
  scheduleHint();
}
async function moveJellies(){
  const myG=G;const js=[];for(let r=0;r<G.rows;r++)for(let c=0;c<G.cols;c++){const t=inB(r,c)&&G.grid[r][c];if(t&&t.jelly)js.push([r,c])}
  if(!js.length)return;G.busy=true;const proms=[],moved=new Set();
  for(const [r,c] of js.sort(()=>Math.random()-.5)){const j=G.grid[r][c];if(!j||!j.jelly)continue;
    const nb=[[0,1],[1,0],[0,-1],[-1,0]].map(([a,b])=>[r+a,c+b]).filter(([rr,cc])=>inB(rr,cc)&&G.grid[rr][cc]&&!G.grid[rr][cc].jelly&&!G.grid[rr][cc].encased&&!moved.has(key(rr,cc)));
    if(!nb.length)continue;const [r2,c2]=nb[Math.floor(Math.random()*nb.length)];const o=G.grid[r2][c2];
    G.grid[r][c]=o;G.grid[r2][c2]=j;moved.add(key(r2,c2));moved.add(key(r,c));
    proms.push(moveView(j,r2,c2,.4,'sine.inOut'),moveView(o,r,c,.4,'sine.inOut'))}
  if(proms.length){sfx('swap');await Promise.all(proms);if(G!==myG)return;if(findMatches().length)await resolve();if(G!==myG)return}
  G.busy=false;
}
async function fishFest(){
  const myG=G;bigText('Fischfest!',0xffffff,0xffa000);sfx('combo',5);await sleep(700);
  /* Reichen die Punkte noch nicht für 3 Sterne, läuft das Fest in Runden weiter, bis alle 3 Sterne da sind (oder die Züge aus sind) */
  const goal3=G.lv.stars[2],long=G.score<goal3;let round=0,k=0;
  do{
    const n=Math.min(G.moves,long?6:15);const conv=[];
    for(let i=0;i<n;i++){if(G!==myG)return;const cand=[];for(let r=0;r<G.rows;r++)for(let c=0;c<G.cols;c++){const t=inB(r,c)&&G.grid[r][c];if(t&&!t.special&&!t.encased)cand.push([r,c])}
      if(!cand.length)break;const [r,c]=cand[Math.floor(Math.random()*cand.length)];const t=G.grid[r][c];t.special=Math.random()<.5?'stripeH':'stripeV';refreshTile(t);squish(t,-1);sparkle(cx(c),cy(r),4);sfx('star',k++%5);
      G.moves--;G.score+=150;conv.push([r,c]);updateHUD();await sleep(110)}
    if(!conv.length)break;
    const clear=new Map();for(const [r,c] of conv)clear.set(key(r,c),{r,c,src:'blast'});
    await resolve({clear,fx:[]});if(G!==myG)return;
    round++;
  }while(long&&G.moves>0&&G.score<goal3&&round<8);
  G.score+=G.moves*300;G.moves=0;updateHUD();
}

function genFishCanvas(s){
  const [c,x]=cvs(160,120);x.lineJoin='round';x.lineCap='round';
  const B={oval:[82,60,50,30],disc:[80,58,40,37],long:[82,60,60,17],round:[82,62,36,36],slim:[82,60,56,22],tall:[84,60,42,36]}[s.body];
  const [bx,by,rx,ry]=B;const left=bx-rx,top=by-ry,right=bx+rx,bot=by+ry;
  const body=s.body==='tall'?()=>{x.moveTo(right+4,by);x.quadraticCurveTo(right-14,top-6,bx,top);x.quadraticCurveTo(left+6,top+4,left,by);x.quadraticCurveTo(left+6,bot-4,bx,bot);x.quadraticCurveTo(right-14,bot+6,right+4,by);x.closePath()}:()=>x.ellipse(bx,by,rx,ry,0,0,Math.PI*2);
  const D='rgba(40,20,60,.35)';
  // Extras hinten
  if(s.extra==='sail'){aqFin(x,()=>{x.moveTo(bx-14,top+6);x.quadraticCurveTo(bx-10,top-22,bx+16,top-20);x.quadraticCurveTo(bx+20,top-4,bx+18,top+8)},s.fin,D);aqFin(x,()=>{x.moveTo(bx-14,bot-6);x.quadraticCurveTo(bx-10,bot+22,bx+16,bot+20);x.quadraticCurveTo(bx+20,bot+4,bx+18,bot-8)},s.fin,D)}
  if(s.extra==='rays'){for(let i=0;i<7;i++){const a=-2.4+i*.3;x.beginPath();x.moveTo(bx-10+i*6,top+6);x.lineTo(bx-10+i*6+Math.cos(a)*30,top+6+Math.sin(a)*34);x.lineWidth=4;x.strokeStyle=i%2?s.fin:'#fff4ec';x.stroke()}}
  if(s.extra==='spikes'){for(let i=0;i<16;i++){const a=i/16*Math.PI*2;x.beginPath();x.moveTo(bx+Math.cos(a-.12)*rx*.95,by+Math.sin(a-.12)*ry*.95);x.lineTo(bx+Math.cos(a)*(rx+11),by+Math.sin(a)*(ry+11));x.lineTo(bx+Math.cos(a+.12)*rx*.95,by+Math.sin(a+.12)*ry*.95);x.fillStyle=s.fin;x.fill()}}
  // Schwanz
  const tx=left+4;
  if(s.tail==='fork')aqFin(x,()=>{x.moveTo(tx+4,by);x.lineTo(tx-24,by-22);x.quadraticCurveTo(tx-12,by,tx-24,by+22)},s.fin,D);
  else if(s.tail==='fan')aqFin(x,()=>{x.moveTo(tx+6,by);x.bezierCurveTo(tx-20,by-40,tx-44,by-20,tx-30,by);x.bezierCurveTo(tx-44,by+20,tx-20,by+40,tx+6,by)},hexA(s.fin,.85),D);
  else aqFin(x,()=>{x.moveTo(tx+4,by);x.quadraticCurveTo(tx-22,by-26,tx-20,by);x.quadraticCurveTo(tx-22,by+26,tx+4,by)},s.fin,D);
  if(s.extra!=='sail')aqFin(x,()=>{x.moveTo(bx-18,top+4);x.quadraticCurveTo(bx-4,top-16,bx+16,top+2)},s.fin,D);
  // Körper
  x.beginPath();body();
  if(s.pat==='rainbow'){x.fillStyle=rainbowConic(x,bx,by)}else x.fillStyle=lin(x,top,bot,s.c1,s.c2);
  x.fill();
  x.save();x.beginPath();body();x.clip();x.fillStyle=s.pc;x.strokeStyle=s.pc;
  const P=s.pat;
  if(P==='vstripes'){for(let i=-3;i<=3;i++){x.fillRect(bx+i*13-3,0,6,120)}}
  else if(P==='hlines'){for(let i=-2;i<=2;i++){x.fillRect(0,by+i*ry*.38-2,160,4)}}
  else if(P==='dots'){for(let i=0;i<14;i++){x.beginPath();x.arc(left+8+((i*37)%(rx*2-10)),top+6+((i*23)%(ry*2-8)),2.6,0,7);x.fill()}}
  else if(P==='spots'){for(let i=0;i<9;i++){x.beginPath();x.arc(left+12+((i*29)%(rx*2-20)),top+8+((i*17)%(ry*2-14)),4.5,0,7);x.fill()}}
  else if(P==='swirl'){x.lineWidth=3.5;for(let k=0;k<4;k++){x.beginPath();for(let t=0;t<=40;t++){const xx=left+t*rx*2/40,yy=top+ry*.4+k*ry*.4+Math.sin(t*.5+k)*5;t?x.lineTo(xx,yy):x.moveTo(xx,yy)}x.stroke()}}
  else if(P==='scales'){x.globalAlpha=.35;x.lineWidth=1.5;for(let r=top;r<bot;r+=9)for(let q=left+(r%18?0:5);q<right;q+=10){x.beginPath();x.arc(q,r,5,0,Math.PI);x.stroke()}}
  else if(P==='eyeband'){x.fillRect(right-26,0,9,120);x.fillStyle='rgba(255,255,255,.7)';x.fillRect(right-17,0,2,120)}
  else if(P==='patch'){x.beginPath();x.ellipse(bx-6,by+6,rx*.55,ry*.45,-.3,0,7);x.fill();x.fillStyle='#ffd23f';x.beginPath();x.ellipse(right-12,by+10,8,5,0,0,7);x.fill()}
  else if(P==='neon'){x.fillStyle='#4af0ff';x.fillRect(0,by-5,160,6);x.fillStyle='#ff4a6a';x.fillRect(0,by+2,160,ry)}
  else if(P==='crystal'){x.globalAlpha=.6;x.lineWidth=1.5;for(let i=0;i<7;i++){x.beginPath();x.moveTo(left+i*16,top);x.lineTo(left+i*16+14,by);x.lineTo(left+i*16,bot);x.stroke()}}
  if(s.extra==='tailspot'){x.fillStyle='#2a1a1a';x.beginPath();x.arc(left+14,by-6,6,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(left+14,by-6,2.4,0,7);x.fill()}
  x.restore();
  if(s.extra==='lure'){x.beginPath();x.moveTo(right-10,top+8);x.quadraticCurveTo(right+6,top-26,right+22,top-10);x.lineWidth=2.5;x.strokeStyle='#4a2a9a';x.stroke();const g=x.createRadialGradient(right+22,top-10,1,right+22,top-10,12);g.addColorStop(0,'#fffbd0');g.addColorStop(.4,'#ffe86a');g.addColorStop(1,'rgba(255,230,100,0)');x.fillStyle=g;x.beginPath();x.arc(right+22,top-10,12,0,7);x.fill()}
  aqFin(x,()=>x.ellipse(bx+6,by+ry*.45,9,5,.6,0,Math.PI*2),hexA(s.fin,.9),D,1.5);
  aqGloss(x,body);
  const er=s.body==='long'||s.body==='slim'?6.5:s.body==='round'?11:8.5;aqEye(x,right-16,by-ry*.25,er);
  MOUTH_REC=[right-3,by+ry*.3];x.beginPath();x.arc(right-3,by+ry*.3,3,.2*Math.PI,.9*Math.PI);x.lineWidth=2;x.strokeStyle='rgba(60,20,40,.7)';x.stroke();
  return c;
}

function rid(n){const A='abcdefghijkmnpqrstuvwxyz23456789';let s='';const a=new Uint32Array(n);(window.crypto||{getRandomValues:x=>x.map(()=>Math.random()*1e9)}).getRandomValues(a);for(const v of a)s+=A[v%A.length];return s}
function ensureIds(){if(!S.online)S.online={};if(!S.online.playerId){S.online.playerId=rid(16);S.online.token=rid(24);save()}}
async function api(body,timeout=12000){
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),timeout);
  try{const r=await fetch(SHEETS_URL,{method:'POST',body:JSON.stringify(body),signal:ctl.signal});return await r.json()}finally{clearTimeout(t)}
}
function progressStats(){let stars=0,score=0,max=0;for(const [k,v] of Object.entries(S.levels)){if(v&&v.stars>0){stars+=v.stars;score+=v.best||0;max=Math.max(max,+k)}}return{stars,score,max}}

let syncBusy=false,lastSync=0;

function progSig(){const st=progressStats();const a=S.aqua||{};return [st.max,st.stars,S.pearls,(a.fish||[]).length,(a.deco||[]).length,a.food,S.boosters.bomb,S.boosters.current,S.boosters.rainbow,S.shell,(S.chests||[]).length].join('|')}
async function syncOnline(force,opts={}){
  if(!onlineReady()||!S.nick||syncBusy||nickBad(S.nick)||(S.online&&S.online.removed))return null;if(!force&&Date.now()-lastSync<30000)return null;
  ensureIds();syncBusy=true;lastSync=Date.now();const st=progressStats();const sig=progSig();
  try{const r=await api({action:'sync',gen:RESET_GEN,base:S.online.srev||0,force:!!opts.force,playerId:S.online.playerId,token:S.online.token,nick:S.nick,v:VERSION,maxLevel:st.max,stars:st.stars,score:st.score,hidden:!S.settings.leaderboard,save:JSON.stringify(exportSave())});
    if(r&&r.ok){if(r.code)S.online.code=r.code;if(r.rev){S.online.srev=r.rev;S.online.sig=sig}save()}
    else if(r&&r.err==='removed')gotRemoved();
    else if(r&&r.err==='stale'){S.online.behind=r.rev;save();setTimeout(()=>checkRemote(true),400)}
    return r}
  catch(e){return null}finally{syncBusy=false}
}
function gotRemoved(){if(!S.online||S.online.removed)return;S.online.removed=true;save();toast('Du wurdest aus der Rangliste entfernt.')}
let remoteBusy=false,remoteT=0;
async function checkRemote(now){
  if(!onlineReady()||!S.nick||(S.online&&S.online.removed))return;if(!S.online||!S.online.playerId){await syncOnline(true);return}
  if(remoteBusy||screen!=='menu'||document.querySelector('.ov,.tut,.cv'))return;if(!now&&Date.now()-remoteT<60000)return;
  remoteBusy=true;remoteT=Date.now();let r=null;
  try{r=await api({action:'check',playerId:S.online.playerId,token:S.online.token})}catch(e){}finally{remoteBusy=false}
  if(!r||!r.ok){if(r&&r.err==='none'){if(S.online.srev>0)gotRemoved();else syncOnline(true)}return}
  const dirty=progSig()!==S.online.sig;
  if((r.rev||0)<=(S.online.srev||0)){if(dirty||!S.online.sig)syncOnline(true);return}
  if(!dirty&&S.online.sig){takeRemote(false);return}
  if(screen!=='menu'||document.querySelector('.ov,.tut,.cv'))return;
  const here=progressStats().max;
  const ov=dialog(`<h2>📱 Anderes Gerät</h2><p>Auf einem anderen Gerät wurde weitergespielt.</p>
    <div class="cmpRow"><div class="cmp"><b>Dort</b><span>Level ${r.lvl}</span><span>${fmt(r.pearls)} <i class="pearl s"></i></span></div><div class="cmp"><b>Hier</b><span>Level ${here}</span><span>${fmt(S.pearls)} <i class="pearl s"></i></span></div></div>
    <p class="muted">Welchen Spielstand möchtest du behalten? Der andere wird ersetzt.</p>
    <div class="row"><button class="btn green" id="rmTake">📥 Den von dort</button><button class="btn cyan" id="rmKeep">📱 Diesen hier</button></div>`);
  ov.querySelector('#rmTake').onclick=()=>{ov.close();takeRemote(true)};
  ov.querySelector('#rmKeep').onclick=async()=>{ov.close();const x=await syncOnline(true,{force:true});toast(x&&x.ok?'✅ Dieser Spielstand ist jetzt überall aktuell':'Keine Verbindung – später nochmal')};
}
async function takeRemote(ask){
  let r=null;try{r=await api({action:'pull',playerId:S.online.playerId,token:S.online.token})}catch(e){}
  if(!r||!r.ok||!r.save){if(ask)toast('Das hat nicht geklappt – bitte später nochmal');return}

  const inp=d.querySelector('#admPw');setTimeout(()=>inp.focus(),300);
  const go=()=>{if(pwHash(inp.value)===ADMIN_HASH){d.close();adminPanel()}else{d.querySelector('#admErr').textContent='Falsches Passwort';sfx('nope');inp.value=''}};
  d.querySelector('#admOk').onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
}
function adminPanel(){
  const d=dialog(`<h2>🛠️ Admin-Cheats</h2><p>Perlen: <b id="admP">${fmt(S.pearls)}</b> · Leben: <b id="admL">${S.lives}</b></p>
    <div class="row"><button class="btn yellow" id="admPearl">+100 Perlen <i class="pearl s"></i></button><button class="btn" id="admLife">+1 Leben ❤️</button><button class="btn purple" id="admChest">🎁 Truhe testen</button><button class="btn purple" id="admShell">🐚 Muschel testen</button><button class="btn purple" id="admShark">🦈 Hai rufen</button></div>
    <div class="srow" style="margin-top:12px"><span class="nm">🔓 Shop-Sperren aufheben<br><span class="muted">zum Testen</span></span><label class="tg"><input type="checkbox" id="admUnl" ${S.adminUnlock?'checked':''}><span></span></label></div>
    <div class="srow" style="margin-top:12px"><span class="nm">⏭️ Zu Level springen<br><span class="muted">Nächstes Level = Zahl (1–${MAX_LEVEL}). Level danach verlieren ihre Sterne.</span></span></div>
    <div class="row"><input class="inp" id="admLv" type="number" inputmode="numeric" min="1" max="${MAX_LEVEL}" placeholder="Level" value="${nextLevel()}" style="width:110px"><button class="btn cyan" id="admJump">Springen</button></div>
    <div class="err" id="admJE"></div>
    <div class="row"><button class="btn gray" data-close>Schließen</button></div>`,{onClose:()=>{updateTopbar();if(G)updateHUD()}});
  d.querySelector('#admJump').onclick=()=>{const n=Math.floor(+d.querySelector('#admLv').value);if(!(n>=1&&n<=MAX_LEVEL)){d.querySelector('#admJE').textContent='Bitte 1 bis '+MAX_LEVEL;return}
    for(let k=1;k<n;k++){if(!S.levels[k]||!(S.levels[k].stars>0))S.levels[k]={stars:1,best:0}}
    for(const k of Object.keys(S.levels))if(+k>=n)delete S.levels[k];
    S.inLevel=0;save();sfx('pearl');d.querySelector('#admJE').textContent='';toast('⏭️ Nächstes Level: '+n);upd();renderMenu()};
  d.querySelector('#admUnl').onchange=e=>{S.adminUnlock=e.target.checked;save()};
  const upd=()=>{d.querySelector('#admP').textContent=fmt(S.pearls);d.querySelector('#admL').textContent=S.lives;updateTopbar()};
  d.querySelector('#admShark').onclick=()=>{d.close();setTimeout(()=>{AQ.sharkT=0;if(AQ.shark)AQ.shark.on=AQ.shark.on;aqSharkStart()},400)};
  d.querySelector('#admShell').onclick=()=>{chestScene([{icon:BOOST.current.icon,text:BOOST.current.name}],'shell')};
  d.querySelector('#admChest').onclick=()=>{chestScene([{icon:BOOST.bomb.icon,text:BOOST.bomb.name},{icon:'<i class="pearl"></i>',text:'+30 Perlen',count:30}])};
  d.querySelector('#admPearl').onclick=()=>{S.pearls+=100;save();sfx('pearl');upd()};
  d.querySelector('#admLife').onclick=()=>{tickLives();S.lives++;if(S.lives>=LIFE_MAX)S.lifeTs=null;save();sfx('pearl');upd()};
}

/* ---- Nickname-Prüfung, Sicherungs-Erinnerung, Hunger-Erinnerungen ---- */
function checkNick(){
  if(!S.nick||!nickBad(S.nick)||document.querySelector('.ov'))return;
  const d=dialog(`<h2>Neuer Name nötig 🐠</h2><p>Dein Name ist leider nicht erlaubt. Such dir bitte einen neuen aus:</p><input class="inp" id="cnN" maxlength="16"><div class="err" id="cnE"></div><div class="row"><button class="btn green" id="cnOk">Speichern</button></div>`);
  d.querySelector('#cnOk').onclick=()=>{const v=d.querySelector('#cnN').value.trim();const ne=nickError(v);if(ne){d.querySelector('#cnE').textContent=ne;return}S.nick=v;save();d.close();toast('Hallo '+escapeHTML(v)+'! 👋');syncOnline(true)};
}
function backupCheck(){
  if(!onlineReady()||!S.nick||(S.online&&S.online.pinSet)||document.querySelector('.ov'))return;
  const done=lastDone(),asked=S.backupAsk||0;const th=[3,10,25,50,100].find(t=>t>asked)||(Math.floor(asked/100)+1)*100;
  if(done<th)return;S.backupAsk=done;save();
  const d=dialog(`<h2>💾 Spielstand sichern?</h2><p>Dein Fortschritt liegt nur auf diesem Gerät. Mit einem <b>Code und einer PIN</b> kannst du ihn jederzeit zurückholen – auch auf einem neuen Handy.</p><div class="row"><button class="btn green" id="bkGo">Jetzt sichern</button><button class="btn gray" data-close>Später</button></div>`);
  d.querySelector('#bkGo').onclick=()=>{d.close();codeDialog()};
}
const HUNGER_WARN=.25;
function hungerList(){return liveFish().map(f=>({f,h:hungerOf(f)})).filter(x=>x.h<=HUNGER_WARN).sort((a,b)=>a.h-b.h)}
function hungerCheckMenu(){
  const l=hungerList();const feed=$('#mFeed');if(feed)feed.classList.toggle('hungry',l.length>0);return l;
}
function hungerToast(){
  const l=hungerList();if(!l.length||document.querySelector('.ov'))return;
  const x=l[0];const left=DAY*x.h,hrs=Math.floor(left/3600000),mins=Math.floor(left/60000)%60;
  toast(`🍤 ${escapeHTML(x.f.data?x.f.data.name:x.f.name)}${l.length>1?' und '+(l.length-1)+' weitere haben':' hat'} Hunger! Noch ${hrs} Std. ${mins} Min.`);
}
let hungerTimer=null,hungerLastNext=0;
function showNotif(title,body){
  try{if(!('Notification' in window)||Notification.permission!=='granted')return;
    if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,icon:'icon-192.png',badge:'icon-192.png',tag:'hunger',renotify:true})).catch(()=>{try{new Notification(title,{body,icon:'icon-192.png'})}catch(e){}});
    else new Notification(title,{body,icon:'icon-192.png'})}catch(e){}
}
function scheduleHungerNotify(){
  clearTimeout(hungerTimer);
  if(!S||!S.aqua||!S.settings.notify||!('Notification' in window)||Notification.permission!=='granted')return;
  const now=Date.now();const alerts=liveFish().map(f=>({t:f.fedAt+DAY*(1-HUNGER_WARN),n:f.name})).filter(a=>a.t>now).sort((a,b)=>a.t-b.t);
  const next=alerts.length?alerts[0].t:0;
  if(next!==hungerLastNext){hungerLastNext=next;try{caches.open('fs-meta').then(c=>c.put('/__hunger',new Response(JSON.stringify({next,name:alerts.length?alerts[0].n:''})))).catch(()=>{})}catch(e){}}
  if(next&&next-now<2147000000)hungerTimer=setTimeout(()=>{const l=hungerList();if(l.length)showNotif('🐠 Dein Fisch hat Hunger!',`${l[0].f.name}${l.length>1?' und '+(l.length-1)+' weitere brauchen':' braucht'} Futter, bevor die Zeit abläuft.`);scheduleHungerNotify()},next-now+500);
}
async function setNotify(on){
  if(!on){S.settings.notify=false;save();clearTimeout(hungerTimer);return true}
  if(!('Notification' in window)){toast('Benachrichtigungen werden hier nicht unterstützt');return false}
  let p=Notification.permission;if(p==='default')try{p=await Notification.requestPermission()}catch(e){}
  if(p!=='granted'){toast('Benachrichtigungen sind blockiert. Erlaube sie in den Browser-Einstellungen.');return false}
  S.settings.notify=true;save();scheduleHungerNotify();
  try{const reg=await navigator.serviceWorker.ready;if(reg.periodicSync)await reg.periodicSync.register('hunger',{minInterval:6*3600*1000})}catch(e){}
  return true;
}
function calendarReminder(){
  const d=dialog(`<h2>📅 Tägliche Erinnerung</h2><p>Du bekommst eine Datei für deinen Kalender. Er erinnert dich dann jeden Tag zur gewählten Uhrzeit ans Füttern.</p><input class="inp" id="clT" type="time" value="18:00" style="width:140px"><div class="row"><button class="btn green" id="clGo">Kalender-Datei laden</button><button class="btn gray" data-close>Abbrechen</button></div>`);
  d.querySelector('#clGo').onclick=()=>{const [h,m]=(d.querySelector('#clT').value||'18:00').split(':');const pad=n=>String(n).padStart(2,'0');const t=new Date();
    const ds=`${t.getFullYear()}${pad(t.getMonth()+1)}${pad(t.getDate())}T${pad(h)}${pad(m)}00`;const st=t.toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
    const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//FishSmuggler//DE','BEGIN:VEVENT','UID:fishsmuggler-feed@fishsmuggler','DTSTAMP:'+st,'DTSTART:'+ds,'DURATION:PT15M','RRULE:FREQ=DAILY','SUMMARY:Fische füttern (FishSmuggler)','DESCRIPTION:Deine Fische brauchen Futter!','BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:Deine Fische haben Hunger!','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
    try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));a.download='FishSmuggler-Erinnerung.ics';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);d.close();toast('📅 Öffne die Datei, um sie im Kalender zu speichern')}catch(e){toast('Das hat nicht geklappt')}};
}

/* ---- Bindings ---- */
function bindUI(){
  document.addEventListener('pointerdown',()=>AU.init(),{capture:true});
  document.addEventListener('click',e=>{if(e.target.closest('button'))sfx('click')},{capture:true});
  $('#nickGo').onclick=()=>{const v=$('#nickIn').value.trim();{const ne=nickError(v);if(ne){$('#nickErr').textContent=ne;sfx('nope');return}}S.nick=v;save();AU.init();Music.start();enterMenu();toast('Willkommen, '+escapeHTML(v)+'! 🐠')};
  $('#nickIn').addEventListener('keydown',e=>{if(e.key==='Enter')$('#nickGo').click()});
  $('#playBtn').onclick=()=>{const n=nextLevel();if(n<=MAX_LEVEL)preLevel(n)};
  $('#mFeed').onclick=aqFeed;$('#mEdit').onclick=()=>aqSetEdit(!AQ.edit);$('#editDone').onclick=()=>aqSetEdit(false);
  $('#inv').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.fid)aqUnstoreFish(+b.dataset.fid);else aqPlaceFromInv(+b.dataset.id)});
  window.addEventListener('pointerup',()=>aqDragEnd());
  document.addEventListener('pointerdown',e=>{if(!e.target.closest('#fishInfo'))$('#fishInfo').style.display='none'},{capture:true});
  document.addEventListener('pointerdown',()=>{try{if(window.screen.orientation&&window.screen.orientation.lock)window.screen.orientation.lock('landscape').catch(()=>{})}catch(e){}},{once:true});
  $('#mSet').onclick=settingsDialog;{const fb=$('#mFull');if(!document.documentElement.requestFullscreen||isStandalone())fb.style.display='none';else fb.onclick=toggleFullscreen}$('#mShop').onclick=()=>shopDialog('fish');$('#mPearls').onclick=()=>shopDialog('boost');$('#mWheel').onclick=wheelDialog;
  $('#mRank').onclick=rankDialog;
  $('#loadCode').onclick=loadCodeDialog;
  $('#mLives').onclick=()=>{tickLives();if(S.lives<LIFE_MAX)noLivesDialogOrInfo();else toast('Deine Leben sind voll ❤️')};
  document.querySelectorAll('.bst[data-b]').forEach(b=>b.onclick=()=>selectBooster(b.dataset.b));
  $('#gPause').onclick=pauseMenu;
  $('#hMovesBox').onclick=()=>{if(G&&!G.busy&&!G.ended&&$('#hMovesBox').classList.contains('fin')){sfx('combo',4);win()}};$('#bCancel').onclick=cancelBooster;
  $('#bDir').onclick=()=>{if(!G)return;G.boostDir=G.boostDir==='row'?'col':'row';$('#bDir').textContent=G.boostDir==='row'?'↔ Reihe':'↕ Spalte'};
  window.addEventListener('resize',()=>{clearTimeout(window._rt);window._rt=setTimeout(onResize,60)});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){gsap.ticker.wake();setTimeout(()=>checkRemote(false),800)}if(!AU.ctx)return;if(document.hidden)AU.ctx.suspend();else AU.ctx.resume()});
  setInterval(()=>{if(screen==='menu')updateTopbar()},1000);
}
function noLivesDialogOrInfo(){if(S.lives<=0)return noLivesDialog();toast(`❤️ ${S.lives}/${LIFE_MAX} · nächstes in ${mmss(lifeRemain())}`)}

/* ---- Start ---- */
async function boot(){
  loadSave();
  if(!window.PIXI||!window.gsap){$('#loadTxt').innerHTML='Die Spiel-Engine konnte nicht geladen werden.<br>Bitte prüfe deine Internetverbindung und lade neu.';return}
  try{await document.fonts.load('700 20px Fredoka')}catch(e){}
  try{await initPixi()}catch(e){console.error(e);$('#loadTxt').innerHTML='Dein Browser unterstützt leider kein WebGL. 😢';return}
  logo($('#logoBig'),'FishSmuggler');logo($('#aqLogo'),'FishSmuggler');
  bindUI();applyQuality();
  if(S.inLevel){S.inLevel=0;loseLife();save()} // Level abgebrochen (z. B. Tab geschlossen)
  if(!S.nick)showScreen('login');else enterMenu();
  gsap.ticker.wake();
  gsap.to('#loader',{opacity:0,duration:.4,onComplete:()=>$('#loader').remove()});
}
boot();
</script>
